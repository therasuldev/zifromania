name: zifromania
description: "ZifroMania is a dynamic math puzzle game designed to boost your brainpower."
publish_to: 'none'

version: 3.1.1+8

environment:
  sdk: ^3.6.1

dependencies:
  # ==================== FLUTTER & CORE ====================
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  async: ^2.13.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.3.1
  logger: ^2.5.0
  package_info_plus: ^10.2.0

  # ==================== STATE MANAGEMENT ====================
  flutter_riverpod: ^3.4.2

  # ==================== NAVIGATION ====================
  go_router: ^18.0.0

  # ==================== FIREBASE ====================
  firebase_core: ^4.9.0
  firebase_auth: 6.5.0
  cloud_firestore: 6.4.0
  firebase_remote_config: 6.5.1
  firebase_messaging: 16.2.1

  # ==================== AUTHENTICATION ====================
  google_sign_in: ^7.2.0
  # sign_in_with_apple: ^8.1.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  googleapis_auth: ^2.3.3
  crypto: ^3.0.7

  # ==================== NETWORKING & API ====================
  http: ^1.1.0
  # dio: ^5.8.0+1

  # ==================== AUDIO & HAPTICS ====================
  audioplayers: ^6.8.1
  vibration: ^3.1.3

  # ==================== ANIMATIONS & UI ====================
  lottie: ^3.3.1
  animated_text_kit: ^4.2.3
  shimmer: ^3.0.0
  confetti: ^0.8.0

  # ==================== IMAGES & SVG ====================
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_svg: ^2.1.0

  # ==================== LOCALIZATION ====================
  easy_localization: ^3.0.7+1

  # ==================== ADS ====================
  google_mobile_ads: ^9.0.0

  # ==================== IN-APP PURCHASES ====================
  in_app_purchase: ^3.3.0
  in_app_purchase_storekit: ^0.4.10+1
  in_app_purchase_android: ^0.5.1

  # ==================== WEB & EXTERNAL LINKS ====================
  webview_flutter: ^4.11.0
  url_launcher: ^6.3.1

  # ==================== NOTIFICATIONS & BACKGROUND TASKS ====================
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  workmanager:
    git:
      url: https://github.com/fluttercommunity/flutter_workmanager.git
      path: workmanager
      ref: main

  # ==================== SHARING & EMAIL ====================
  share_plus: ^13.2.0
  mailer: ^7.1.0

  # ==================== CONFIGURATION ====================
  flutter_dotenv: ^6.0.1
  versionarte: ^2.1.2


dev_dependencies:
  # ==================== TESTING ====================
  flutter_test:
    sdk: flutter

  # ==================== LINTING ====================
  flutter_lints: ^6.0.0

  # ==================== IN-APP PURCHASE TESTING / PLATFORM ====================
  in_app_purchase_platform_interface: ^1.4.1


flutter:
  uses-material-design: true

  # ==================== ASSETS ====================
  assets:
    - assets/sounds/
    - assets/images/
    - assets/icons/
    - assets/title-avatars/
    - assets/lotties/timer.json
    - assets/translations/
    - assets/html/
    - assets/zifromania-service-account.json
    - assets/questions/
    - .env

  # ==================== FONTS ====================
  fonts:
    - family: Onacona
      fonts:
        - asset: assets/fonts/Onacona.ttf

    - family: Brawler
      fonts:
        - asset: assets/fonts/Brawler.ttf
          weight: 700

    - family: rimouskisb
      fonts:
        - asset: assets/fonts/rimouskisb.otf

    - family: WAGHU-PersonalUse
      fonts:
        - asset: assets/fonts/WAGHU-PersonalUse.otf

    - family: Scabber
      fonts:
        - asset: assets/fonts/Scabber.ttf